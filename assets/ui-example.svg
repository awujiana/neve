<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="UI 示例图 · 仪表盘界面预览">
  <defs>
    <linearGradient id="ubg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="ubar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="ush" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#ubg)"/>
  <text x="600" y="44" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#475569">UI 示例图 · 仪表盘界面预览</text>

  <!-- window -->
  <rect x="120" y="70" width="960" height="640" rx="16" fill="#ffffff" filter="url(#ush)"/>

  <!-- top bar -->
  <rect x="120" y="70" width="960" height="56" rx="16" fill="#f8fafc"/>
  <rect x="120" y="110" width="960" height="16" fill="#f8fafc"/>
  <circle cx="152" cy="98" r="7" fill="#ef4444"/>
  <circle cx="176" cy="98" r="7" fill="#f59e0b"/>
  <circle cx="200" cy="98" r="7" fill="#22c55e"/>
  <rect x="240" y="90" width="200" height="14" rx="7" fill="#cbd5e1"/>

  <!-- sidebar -->
  <rect x="120" y="126" width="220" height="584" fill="#f1f5f9"/>
  <rect x="144" y="160" width="172" height="34" rx="8" fill="url(#ubar)"/>
  <g fill="#cbd5e1">
    <rect x="144" y="212" width="172" height="28" rx="8"/>
    <rect x="144" y="252" width="172" height="28" rx="8"/>
    <rect x="144" y="292" width="172" height="28" rx="8"/>
    <rect x="144" y="332" width="172" height="28" rx="8"/>
    <rect x="144" y="372" width="172" height="28" rx="8"/>
  </g>
  <rect x="144" y="640" width="172" height="40" rx="8" fill="#e2e8f0"/>

  <!-- stat cards -->
  <g>
    <rect x="368" y="160" width="220" height="110" rx="12" fill="#eef2ff"/>
    <rect x="392" y="186" width="80" height="12" rx="6" fill="#94a3b8"/>
    <rect x="392" y="214" width="120" height="30" rx="8" fill="#6366f1"/>

    <rect x="612" y="160" width="220" height="110" rx="12" fill="#ecfdf5"/>
    <rect x="636" y="186" width="80" height="12" rx="6" fill="#94a3b8"/>
    <rect x="636" y="214" width="120" height="30" rx="8" fill="#22c55e"/>

    <rect x="856" y="160" width="200" height="110" rx="12" fill="#fef3c7"/>
    <rect x="880" y="186" width="80" height="12" rx="6" fill="#94a3b8"/>
    <rect x="880" y="214" width="120" height="30" rx="8" fill="#f59e0b"/>
  </g>

  <!-- bar chart -->
  <rect x="368" y="300" width="356" height="200" rx="12" fill="#f8fafc"/>
  <g fill="#a855f7">
    <rect x="404" y="430" width="34" height="44" rx="6"/>
    <rect x="456" y="396" width="34" height="78" rx="6"/>
    <rect x="508" y="360" width="34" height="114" rx="6"/>
    <rect x="560" y="412" width="34" height="62" rx="6"/>
    <rect x="612" y="376" width="34" height="98" rx="6"/>
    <rect x="664" y="346" width="34" height="128" rx="6"/>
  </g>

  <!-- table -->
  <rect x="752" y="300" width="304" height="200" rx="12" fill="#f8fafc"/>
  <g fill="#e2e8f0">
    <rect x="772" y="324" width="264" height="22" rx="6"/>
    <rect x="772" y="360" width="264" height="18" rx="6"/>
    <rect x="772" y="392" width="264" height="18" rx="6"/>
    <rect x="772" y="424" width="264" height="18" rx="6"/>
    <rect x="772" y="456" width="264" height="18" rx="6"/>
  </g>
  <g fill="#cbd5e1">
    <rect x="772" y="324" width="90" height="22" rx="6"/>
    <rect x="772" y="360" width="70" height="18" rx="6"/>
    <rect x="772" y="392" width="100" height="18" rx="6"/>
    <rect x="772" y="424" width="60" height="18" rx="6"/>
    <rect x="772" y="456" width="80" height="18" rx="6"/>
  </g>

  <text x="600" y="724" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8">示例图：将真实 UI 截图替换此占位图即可</text>
</svg>
