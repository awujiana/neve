<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="我的 README 风格展示图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <text x="600" y="46" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#4338ca">README 展示图 · Showcase</text>

  <!-- document card -->
  <rect x="320" y="70" width="560" height="470" rx="18" fill="#ffffff" filter="url(#sh)"/>

  <!-- badge pills -->
  <g>
    <rect x="352" y="104" width="118" height="28" rx="14" fill="#3b82f6"/>
    <circle cx="372" cy="118" r="6" fill="#ffffff" opacity="0.9"/>
    <rect x="486" y="104" width="118" height="28" rx="14" fill="#22c55e"/>
    <circle cx="506" cy="118" r="6" fill="#ffffff" opacity="0.9"/>
    <rect x="620" y="104" width="118" height="28" rx="14" fill="#f59e0b"/>
    <circle cx="640" cy="118" r="6" fill="#ffffff" opacity="0.9"/>
    <rect x="754" y="104" width="86" height="28" rx="14" fill="#a855f7"/>
    <circle cx="772" cy="118" r="6" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- title line -->
  <rect x="352" y="156" width="300" height="22" rx="6" fill="#cbd5e1"/>
  <rect x="352" y="192" width="430" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="352" y="208" width="380" height="10" rx="5" fill="#e2e8f0"/>

  <!-- section blocks -->
  <g>
    <rect x="352" y="236" width="508" height="74" rx="10" fill="#f1f5f9"/>
    <rect x="372" y="254" width="120" height="12" rx="6" fill="#94a3b8"/>
    <rect x="372" y="276" width="468" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="372" y="292" width="440" height="8" rx="4" fill="#e2e8f0"/>

    <rect x="352" y="322" width="508" height="74" rx="10" fill="#f1f5f9"/>
    <rect x="372" y="340" width="120" height="12" rx="6" fill="#94a3b8"/>
    <rect x="372" y="362" width="468" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="372" y="378" width="400" height="8" rx="4" fill="#e2e8f0"/>
  </g>

  <!-- checklist -->
  <g>
    <rect x="352" y="412" width="508" height="106" rx="10" fill="#faf5ff"/>
    <g fill="none" stroke="#22c55e" stroke-width="3">
      <circle cx="376" cy="438" r="11"/>
      <circle cx="376" cy="472" r="11"/>
      <circle cx="376" cy="506" r="11"/>
    </g>
    <path d="M370 438 l4 5 l8 -10 M370 472 l4 5 l8 -10 M370 506 l4 5 l8 -10" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="400" y="432" width="430" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="400" y="466" width="430" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="400" y="500" width="360" height="10" rx="5" fill="#e2e8f0"/>
  </g>

  <!-- ribbon -->
  <rect x="700" y="490" width="180" height="34" rx="17" fill="url(#accent)"/>
  <text x="790" y="512" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff">AGPL-3.0</text>
</svg>
