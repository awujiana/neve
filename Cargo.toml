[package]
name = "neve"
version = "0.1.0"
edition = "2024"
description = "Névé — PCL2 式 MPV 播放器与脚本管理器（纯 Rust + GPUI）"
license = "AGPL-3.0"

[dependencies]
# GPUI Kit：单依赖入口，内含 GPUI + gpui-base + gpui-component（75+ 组件）与平台启动封装
gpui-kit = "0.7"

# Windows 注册表读取（core::players 注册表扫描）
[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
